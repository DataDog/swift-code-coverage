name: Build LLVM XCFrameworks
on:
  workflow_call:
    outputs:
      llvm19-cache-key:
        description: "Cache key for LLVM19.xcframework"
        value: ${{ jobs.build-xcframework.outputs.llvm19 }}
permissions:
  contents: read
jobs:
  build-llvm-libs:
    runs-on: macos-26
    strategy:
      matrix:
        version: [19]
        platform: [macosx, maccatalyst, iphoneos, iphonesimulator, appletvos, appletvsimulator, watchos, watchsimulator, xros, xrsimulator]
    outputs:
      macosx19: ${{ steps.llvm-cache-key.outputs.llvm19_macosx }}
      maccatalyst19: ${{ steps.llvm-cache-key.outputs.llvm19_maccatalyst }}
      iphoneos19: ${{ steps.llvm-cache-key.outputs.llvm19_iphoneos }}
      iphonesimulator19: ${{ steps.llvm-cache-key.outputs.llvm19_iphonesimulator }}
      appletvos19: ${{ steps.llvm-cache-key.outputs.llvm19_appletvos }}
      appletvsimulator19: ${{ steps.llvm-cache-key.outputs.llvm19_appletvsimulator }}
      watchos19: ${{ steps.llvm-cache-key.outputs.llvm19_watchos }}
      watchsimulator19: ${{ steps.llvm-cache-key.outputs.llvm19_watchsimulator }}
      xros19: ${{ steps.llvm-cache-key.outputs.llvm19_xros }}
      xrsimulator19: ${{ steps.llvm-cache-key.outputs.llvm19_xrsimulator }}
    timeout-minutes: 1200
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Calculate and save cache key for llvm library
        id: llvm-cache-key
        run: |
          HASH=${{ hashFiles('llvm/patches/**', 'Makefile.llvm') }}
          KEY="llvm${{ matrix.version }}-${{ matrix.platform }}-$HASH"
          echo "llvm_current=$KEY" >> "$GITHUB_OUTPUT"
          echo "llvm${{matrix.version}}_${{matrix.platform}}=$KEY" >> "$GITHUB_OUTPUT"
      - name: Check cache for built binary
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        id: llvm-build-cache
        with:
          path: llvm/build/libs/llvm${{ matrix.version }}/${{ matrix.platform }}
          key: ${{ steps.llvm-cache-key.outputs.llvm_current }}
          lookup-only: true
      - name: Select Xcode 26.0
        if: steps.llvm-build-cache.outputs.cache-hit != 'true'
        run: sudo xcode-select --switch /Applications/Xcode_26.0.app
      - name: Build LLVM ${{ matrix.version }} for ${{ matrix.platform }}
        if: steps.llvm-build-cache.outputs.cache-hit != 'true'
        run: make -f Makefile.llvm llvm/build/libs/llvm${{ matrix.version }}/${{ matrix.platform }}

  build-xcframework:
    needs: build-llvm-libs
    runs-on: macos-latest
    strategy:
      matrix:
        version: [19]
    outputs:
      llvm19: ${{ steps.llvm-cache-key.outputs.llvm19_framework }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Calculate and save cache key for llvm framework
        id: llvm-cache-key
        run: |
          HASH=${{ hashFiles('llvm/patches/**', 'Makefile.llvm') }}
          KEY="llvm${{ matrix.version }}-framework-$HASH"
          echo "llvm_current=$KEY" >> "$GITHUB_OUTPUT"
          echo "llvm${{matrix.version}}_framework=$KEY" >> "$GITHUB_OUTPUT"
      - name: Check cache for built binary
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        id: llvm-build-cache
        with:
          path: llvm/xcframeworks/LLVM${{ matrix.version }}.xcframework
          key: ${{ steps.llvm-cache-key.outputs.llvm_current }}
          lookup-only: true
      - name: Download llvm ${{matrix.version}} for macosx
        if: steps.llvm-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: llvm/build/libs/llvm${{matrix.version}}/macosx
          key: ${{ needs.build-llvm-libs.outputs[format('macosx{0}', matrix.version)] }}
          fail-on-cache-miss: true
      - name: Download llvm ${{matrix.version}} for maccatalyst
        if: steps.llvm-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: llvm/build/libs/llvm${{matrix.version}}/maccatalyst
          key: ${{ needs.build-llvm-libs.outputs[format('maccatalyst{0}', matrix.version)] }}
          fail-on-cache-miss: true
      - name: Download llvm ${{matrix.version}} for iphoneos
        if: steps.llvm-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: llvm/build/libs/llvm${{matrix.version}}/iphoneos
          key: ${{ needs.build-llvm-libs.outputs[format('iphoneos{0}', matrix.version)] }}
          fail-on-cache-miss: true
      - name: Download llvm ${{matrix.version}} for iphonesimulator
        if: steps.llvm-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: llvm/build/libs/llvm${{matrix.version}}/iphonesimulator
          key: ${{ needs.build-llvm-libs.outputs[format('iphonesimulator{0}', matrix.version)] }}
          fail-on-cache-miss: true
      - name: Download llvm ${{matrix.version}} for appletvos
        if: steps.llvm-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: llvm/build/libs/llvm${{matrix.version}}/appletvos
          key: ${{ needs.build-llvm-libs.outputs[format('appletvos{0}', matrix.version)] }}
          fail-on-cache-miss: true
      - name: Download llvm ${{matrix.version}} for appletvsimulator
        if: steps.llvm-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: llvm/build/libs/llvm${{matrix.version}}/appletvsimulator
          key: ${{ needs.build-llvm-libs.outputs[format('appletvsimulator{0}', matrix.version)] }}
          fail-on-cache-miss: true
      - name: Download llvm ${{matrix.version}} for watchos
        if: steps.llvm-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: llvm/build/libs/llvm${{matrix.version}}/watchos
          key: ${{ needs.build-llvm-libs.outputs[format('watchos{0}', matrix.version)] }}
          fail-on-cache-miss: true
      - name: Download llvm ${{matrix.version}} for watchsimulator
        if: steps.llvm-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: llvm/build/libs/llvm${{matrix.version}}/watchsimulator
          key: ${{ needs.build-llvm-libs.outputs[format('watchsimulator{0}', matrix.version)] }}
          fail-on-cache-miss: true
      - name: Download llvm ${{matrix.version}} for xros
        if: steps.llvm-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: llvm/build/libs/llvm${{matrix.version}}/xros
          key: ${{ needs.build-llvm-libs.outputs[format('xros{0}', matrix.version)] }}
          fail-on-cache-miss: true
      - name: Download llvm ${{matrix.version}} for xrsimulator
        if: steps.llvm-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: llvm/build/libs/llvm${{matrix.version}}/xrsimulator
          key: ${{ needs.build-llvm-libs.outputs[format('xrsimulator{0}', matrix.version)] }}
          fail-on-cache-miss: true
      - name: Create XCFrameworks
        if: steps.llvm-build-cache.outputs.cache-hit != 'true'
        run: make -f Makefile.llvm llvm${{matrix.version}}_prebuilt_xcframework
